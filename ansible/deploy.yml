- name: Deploy App using Ansible
  hosts: local
  become: yes

  tasks:

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Copy application files
      copy:
        src: "{{ playbook_dir }}/../app/"
        dest: /var/www/html/

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
